<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра Змейка</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #222;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin-bottom: 10px;
            font-size: 24px;
        }
        #score {
            font-size: 18px;
            margin-bottom: 15px;
        }
        canvas {
            background-color: #111;
            border: 2px solid #555;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <h1>Змейка</h1>
    <div id="score">Счет: 0</div>
    <canvas id="game" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];

        let dx = 1;
        let dy = 0;
        let nextDx = 1;
        let nextDy = 0;

        let food = { x: 5, y: 5 };
        let score = 0;
        let gameOver = false;

        function mainLoop() {
            if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = '24px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('ИГРА ОКОНЧЕНА', canvas.width / 2, canvas.height / 2 - 10);
                ctx.font = '16px Arial';
                ctx.fillText('Нажмите Enter для перезапуска', canvas.width / 2, canvas.height / 2 + 20);
                return;
            }

            dx = nextDx;
            dy = nextDy;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Проверка столкновения со стенами
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver = true;
            }

            // Проверка столкновения с самим собой
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                    gameOver = true;
                }
            }

            snake.unshift(head);

            // Поедание еды
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = 'Счет: ' + score;
                placeFood();
            } else {
                snake.pop();
            }

            // Отрисовка
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Рисуем змейку
            ctx.fillStyle = '#4CAF50';
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? '#8BC34A' : '#4CAF50';
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });

            // Рисуем еду
            ctx.fillStyle = '#FF5252';
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);

            setTimeout(mainLoop, 100);
        }

        function placeFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);

            // Проверяем, чтобы еда не появилась внутри змейки
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) {
                    placeFood();
                }
            });
        }

        window.addEventListener('keydown', e => {
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (dy !== 1) { nextDx = 0; nextDy = -1; }
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (dy !== -1) { nextDx = 0; nextDy = 1; }
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (dx !== 1) { nextDx = -1; nextDy = 0; }
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (dx !== -1) { nextDx = 1; nextDy = 0; }
                    break;
                case 'Enter':
                    if (gameOver) {
                        snake = [
                            { x: 10, y: 10 },
                            { x: 9, y: 10 },
                            { x: 8, y: 10 }
                        ];
                        dx = 1;
                        dy = 0;
                        nextDx = 1;
                        nextDy = 0;
                        score = 0;
                        scoreElement.textContent = 'Счет: 0';
                        gameOver = false;
                        placeFood();
                        mainLoop();
                    }
                    break;
            }
        });

        placeFood();
        mainLoop();
    </script>
</body>
</html>
